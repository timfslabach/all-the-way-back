<script>
(function () {
  var EXEC = document.getElementById('go').getAttribute('href');
  var q = {};
  location.hash.slice(1).split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) q[kv[0]] = kv.length > 1 ? decodeURIComponent(kv[1]) : '1'; });
  var key = '';
  try {
    if (q.view === 'friend') key = '';
    else if (q.me) { key = q.me; localStorage.setItem('atwb_me', key); }
    else key = localStorage.getItem('atwb_me') || '';
  } catch (e) { key = q.me || ''; }
  var url = EXEC + (key ? '?me=' + encodeURIComponent(key) : '');
  document.getElementById('go').setAttribute('href', url);
  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (q.stay && !standalone) { document.getElementById('tip').hidden = false; return; }
  setTimeout(function () { location.replace(url); }, standalone ? 0 : 600);
})();
</script>
